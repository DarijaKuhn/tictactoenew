<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tic Tac Toe — Игра</title>
  <style>
    :root{
      --bg:#071022;
      --card: rgba(255,255,255,0.03);
      --accent1:#7c5cff;
      --accent2:#2fb6ff;
      --muted:#9aa6c1;
      --win:#ffd36b;
      --x-color:#ffd36b;
      --o-color:#7ee7ff;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background: radial-gradient(800px 400px at 10% 10%, rgba(47,182,255,0.06), transparent 6%),
                  linear-gradient(180deg,var(--bg), #041020);
      color:#eef6ff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }

    .wrap{ width:100%; max-width:980px; display:grid; grid-template-columns:360px 1fr; gap:28px; }
    @media (max-width:900px){ .wrap{ grid-template-columns: 1fr; padding:12px } }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;padding:22px;border:1px solid rgba(255,255,255,0.04);
      box-shadow: 0 10px 30px rgba(2,6,23,0.6);
    }

    /* left panel */
    .profile .avatar{ width:100px;height:100px;border-radius:16px;background:linear-gradient(90deg,var(--accent1),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#041025;font-size:28px;margin-bottom:12px }
    .profile h2{ margin:0;font-size:18px }
    .profile p{ color:var(--muted); font-size:14px; margin-top:8px }

    .options{ margin-top:16px; display:flex;flex-direction:column; gap:10px }
    .row{ display:flex;gap:8px; align-items:center }
    label{ font-size:13px; color:var(--muted) }

    .select, .toggle{
      padding:10px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.03); color:#eaf5ff; font-weight:700; cursor:pointer;
    }

    .btn-primary{
      margin-top:12px;padding:10px 14px;border-radius:12px;background:linear-gradient(90deg,var(--accent1),var(--accent2)); color:#041025;font-weight:800;border:0; cursor:pointer; box-shadow:0 10px 30px rgba(92,72,255,0.16)
    }

    /* board area */
    .game{
      display:flex;flex-direction:column;align-items:center;gap:12px;
    }
    .header{ width:100%; display:flex;justify-content:space-between; align-items:center }
    .title{ font-size:20px; margin:0 }
    .subtitle{ color:var(--muted); font-size:13px }

    .controls{ display:flex; gap:10px; align-items:center }
    .turn{ font-weight:700; padding:8px 10px; border-radius:10px; background: linear-gradient(90deg,var(--accent1),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent }

    .board-wrap{ position:relative; }
    .board{
      display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:14px; background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:14px; width:100%; max-width:520px;
      border:1px solid rgba(255,255,255,0.02);
    }
    .cell{
      height:110px;border-radius:12px;background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
      display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:#fff; cursor:pointer; user-select:none; transition:transform .12s ease, box-shadow .12s ease;
      border:1px solid rgba(255,255,255,0.02); position:relative;
    }
    .cell:hover{ transform: translateY(-6px); box-shadow: 0 18px 40px rgba(2,6,23,0.5) }
    .cell.x{ color:var(--x-color); text-shadow: 0 6px 18px rgba(255,211,107,0.08) }
    .cell.o{ color:var(--o-color); text-shadow: 0 6px 18px rgba(46,238,255,0.06) }
    .cell.win{ transform: scale(1.06); box-shadow: 0 20px 60px rgba(124,92,255,0.12) }

    .win-overlay{ position:absolute; inset:0; pointer-events:none; overflow:visible }
    .win-path{ stroke: var(--win); stroke-width:3.5; stroke-linecap:round; fill:none; stroke-dasharray:200; stroke-dashoffset:200; transition: stroke-dashoffset 650ms cubic-bezier(.2,.9,.2,1), opacity .2s ease; opacity:0; filter: drop-shadow(0 8px 24px rgba(124,92,255,0.12)); }
    .win-overlay.show .win-path{ stroke-dashoffset:0; opacity:1 }

    .confetti-root{ position:absolute; inset:0; pointer-events:none; overflow:visible }
    .confetti-dot{ position:absolute; width:10px;height:10px;border-radius:50%; transform:translateY(0) scale(.6); opacity:0; transition: transform .9s cubic-bezier(.16,.8,.2,1), opacity .6s ease; }
    .confetti-dot.show{ opacity:1 }

    .info{ min-height:26px; color:var(--muted); font-weight:700; margin-top:6px; text-align:center }

    .scoreboard{ display:flex; gap:12px; margin-top:6px }
    .scorebox{ padding:8px 10px; border-radius:10px; background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005)); border:1px solid rgba(255,255,255,0.02) }
    .scorebox .label{ color:var(--muted); font-size:12px } .scorebox .value{ font-weight:800; margin-top:4px; font-size:18px }

    footer{ color:var(--muted); text-align:center; margin-top:8px }
    @media (max-width:900px){ .wrap{ grid-template-columns: 1fr } .board{ max-width:100% } .cell{ height:86px; font-size:36px } }
  </style>
</head>
<body>
  <div class="wrap" role="main" aria-labelledby="title">
    <aside class="panel profile" aria-label="Панель настроек">
      <div style="text-align:center">
        <div class="avatar">ДК</div>
        <h2>Дария Кюн</h2>
        <p>Игровая страница — выберите режим и уровень, затем нажмите «Новая игра».</p>
      </div>

      <div class="options">
        <div class="row">
          <label for="mode">Режим:</label>
          <select id="mode" class="select" title="Выбрать режим">
            <option value="local">Два игрока (локально)</option>
            <option value="ai">Играть против компьютера</option>
          </select>
        </div>

        <div class="row" id="aiOptions" style="display:flex;align-items:center;gap:8px">
          <label for="difficulty">Сложность:</label>
          <select id="difficulty" class="select" title="Уровень AI">
            <option value="easy">Easy (рандом)</option>
            <option value="medium">Medium (блок/выигрыш)</option>
            <option value="hard">Hard (Minimax)</option>
          </select>
        </div>

        <button id="newGame" class="btn-primary">Новая игра</button>

        <div style="margin-top:8px; display:flex; gap:8px;">
          <button id="clearStorage" class="select">Сбросить счёт и настройки</button>
        </div>

        <div style="margin-top:14px">
          <div class="scoreboard">
            <div class="scorebox"><div class="label">Вы (X)</div><div id="scoreX" class="value">0</div></div>
            <div class="scorebox"><div class="label">Компьютер (O)</div><div id="scoreO" class="value">0</div></div>
            <div class="scorebox"><div class="label">Ничьи</div><div id="scoreD" class="value">0</div></div>
          </div>
        </div>
      </div>
    </aside>

    <section class="panel game" aria-label="Игровая панель">
      <div class="header">
        <div>
          <h3 class="title">Tic‑Tac‑Toe</h3>
          <div class="subtitle">Классическая игра — X ходит первым</div>
        </div>
        <div class="controls">
          <div id="turn" class="turn">Ход: X</div>
        </div>
      </div>

      <div class="board-wrap" aria-hidden="false">
        <div id="board" class="board" role="grid" aria-label="Игровое поле">
          <!-- клетки генерируются скриптом при инициализации, но добавлены также сюда для доступности -->
          <div class="cell" data-index="0" role="button" tabindex="0" aria-label="Клетка 1"></div>
          <div class="cell" data-index="1" role="button" tabindex="0" aria-label="Клетка 2"></div>
          <div class="cell" data-index="2" role="button" tabindex="0" aria-label="Клетка 3"></div>

          <div class="cell" data-index="3" role="button" tabindex="0" aria-label="Клетка 4"></div>
          <div class="cell" data-index="4" role="button" tabindex="0" aria-label="Клетка 5"></div>
          <div class="cell" data-index="5" role="button" tabindex="0" aria-label="Клетка 6"></div>

          <div class="cell" data-index="6" role="button" tabindex="0" aria-label="Клетка 7"></div>
          <div class="cell" data-index="7" role="button" tabindex="0" aria-label="Клетка 8"></div>
          <div class="cell" data-index="8" role="button" tabindex="0" aria-label="Клетка 9"></div>
        </div>

        <div class="win-overlay" id="winOverlay" aria-hidden="true">
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path id="winPath" class="win-path" d="" />
          </svg>
        </div>

        <div id="confettiRoot" class="confetti-root" aria-hidden="true"></div>
      </div>

      <div id="info" class="info" aria-live="polite"></div>

      <footer style="width:100%;text-align:center;margin-top:8px;color:var(--muted)"><a href="../index.html" style="color:var(--muted);text-decoration:underline">← Вернуться на стартовую страницу</a></footer>
    </section>
  </div>

  <script>
    (function(){
      // DOM
      const boardEl = document.getElementById('board');
      const cells = Array.from(document.querySelectorAll('.cell'));
      const turnEl = document.getElementById('turn');
      const newGameBtn = document.getElementById('newGame');
      const modeSelect = document.getElementById('mode');
      const difficultySelect = document.getElementById('difficulty');
      const aiOptions = document.getElementById('aiOptions');
      const clearStorageBtn = document.getElementById('clearStorage');
      const infoEl = document.getElementById('info');
      const scoreXEl = document.getElementById('scoreX');
      const scoreOEl = document.getElementById('scoreO');
      const scoreDEl = document.getElementById('scoreD');
      const winOverlay = document.getElementById('winOverlay');
      const winPath = document.getElementById('winPath');
      const confettiRoot = document.getElementById('confettiRoot');

      // State
      let board = Array(9).fill(null);
      let current = 'X';
      let finished = false;
      let scoreX = 0, scoreO = 0, scoreD = 0;

      // load saved
      const saved = JSON.parse(localStorage.getItem('ttt_scores') || 'null');
      if (saved) { scoreX=saved.x||0; scoreO=saved.o||0; scoreD=saved.d||0; updateScores(); }
      const savedMode = localStorage.getItem('ttt_mode');
      if (savedMode) modeSelect.value = savedMode;
      const savedDiff = localStorage.getItem('ttt_diff');
      if (savedDiff) difficultySelect.value = savedDiff;
      toggleAIOptions();

      const winningLines = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];

      // render
      function render(){
        cells.forEach((c,i) => {
          c.textContent = board[i] || '';
          c.classList.toggle('x', board[i]==='X');
          c.classList.toggle('o', board[i]==='O');
          if (board[i]) c.classList.add('disabled'); else c.classList.remove('disabled');
          c.classList.remove('win');
        });
        turnEl.textContent = 'Ход: ' + current;
        infoEl.textContent = '';
      }

      function checkWinState(){
        for (const line of winningLines){
          const [a,b,c] = line;
          if (board[a] && board[a] === board[b] && board[a] === board[c]) return { winner: board[a], line };
        }
        if (board.every(Boolean)) return { draw: true };
        return null;
      }

      function cellClick(e){
        if (finished) return;
        const idx = Number(e.currentTarget.dataset.index);
        if (board[idx]) return;
        // If mode is AI and it's AI's turn, ignore clicks
        if (modeSelect.value === 'ai' && current === 'O') return;
        board[idx] = current;
        afterMove();
      }

      function afterMove(){
        const res = checkWinState();
        if (res){
          finished = true;
          if (res.winner){
            res.line.forEach(i => cells[i].classList.add('win'));
            infoEl.textContent = 'Победил ' + res.winner + '!';
            if (res.winner === 'X') { scoreX++; } else { scoreO++; }
            saveScores();
            updateScores();
            animateWinLine(res.line);
          } else if (res.draw){
            infoEl.textContent = 'Ничья!';
            scoreD++;
            saveScores();
            updateScores();
            flashDraw();
          }
          cells.forEach(c => c.classList.add('disabled'));
        } else {
          current = current === 'X' ? 'O' : 'X';
          render();
          // если режим AI и теперь ход компьютера — запустить ход AI
          if (!finished && modeSelect.value === 'ai' && current === 'O'){
            setTimeout(aiMove, 320);
          }
        }
        render();
      }

      // AI implementations
      function aiMove(){
        const diff = difficultySelect.value;
        let idx = null;
        if (diff === 'easy') idx = aiRandom();
        else if (diff === 'medium') idx = aiMedium();
        else idx = aiHard(); // minimax
        if (idx === null) { idx = aiRandom(); }
        board[idx] = 'O';
        afterMove();
      }

      function aiRandom(){
        const empties = board.map((v,i)=> v?null:i).filter(v=>v!==null);
        if (!empties.length) return null;
        return empties[Math.floor(Math.random()*empties.length)];
      }

      function aiMedium(){
        // 1) win if possible
        for (let i=0;i<9;i++){
          if (!board[i]){
            board[i]='O';
            if (checkWinState() && checkWinState().winner === 'O'){ board[i]=null; return i; }
            board[i]=null;
          }
        }
        // 2) block player immediate win
        for (let i=0;i<9;i++){
          if (!board[i]){
            board[i]='X';
            if (checkWinState() && checkWinState().winner === 'X'){ board[i]=null; return i; }
            board[i]=null;
          }
        }
        // 3) take center
        if (!board[4]) return 4;
        // 4) take a corner
        const corners = [0,2,6,8].filter(i=>!board[i]);
        if (corners.length) return corners[Math.floor(Math.random()*corners.length)];
        // 5) random
        return aiRandom();
      }

      function aiHard(){
        // minimax: returns best index for 'O'
        const best = minimax(board.slice(), 'O', 0);
        return best.index;
      }

      function minimax(b, player, depth){
        const winner = checkWinStatic(b);
        if (winner === 'O') return { score: 10 - depth };
        if (winner === 'X') return { score: depth - 10 };
        if (b.every(Boolean)) return { score: 0 };

        const moves = [];
        for (let i=0;i<9;i++){
          if (!b[i]){
            const move = { index: i };
            b[i] = player;
            const result = minimax(b, player === 'O' ? 'X' : 'O', depth+1);
            move.score = result.score;
            b[i] = null;
            moves.push(move);
          }
        }

        let bestMove;
        if (player === 'O'){
          // maximize
          let bestScore = -Infinity;
          for (const m of moves) if (m.score > bestScore){ bestScore = m.score; bestMove = m; }
        } else {
          // minimize
          let bestScore = Infinity;
          for (const m of moves) if (m.score < bestScore){ bestScore = m.score; bestMove = m; }
        }
        return bestMove || { index: null, score: 0 };
      }

      function checkWinStatic(b){
        for (const line of winningLines){
          const [a,b1,c] = line;
          if (b[a] && b[a] === b[b1] && b[a] === b[c]) return b[a];
        }
        if (b.every(Boolean)) return 'draw';
        return null;
      }

      // UI helpers
      function animateWinLine(line){
        const rectBoard = boardEl.getBoundingClientRect();
        const centers = cells.map(c => {
          const r = c.getBoundingClientRect();
          return { x: ((r.left + r.right)/2) - rectBoard.left, y: ((r.top + r.bottom)/2) - rectBoard.top };
        });
        const start = centers[line[0]], end = centers[line[2]];
        const sx = (start.x / rectBoard.width) * 100;
        const sy = (start.y / rectBoard.height) * 100;
        const ex = (end.x / rectBoard.width) * 100;
        const ey = (end.y / rectBoard.height) * 100;
        const d = `M ${sx} ${sy} L ${ex} ${ey}`;
        winPath.setAttribute('d', d);
        winOverlay.classList.remove('show');
        winPath.style.transition = 'none';
        winPath.style.strokeDasharray = '200';
        winPath.style.strokeDashoffset = '200';
        requestAnimationFrame(()=> {
          requestAnimationFrame(()=> {
            winOverlay.classList.add('show');
            winPath.style.transition = 'stroke-dashoffset 650ms cubic-bezier(.2,.9,.2,1), opacity .25s ease';
            winPath.style.strokeDashoffset = '0';
          });
        });
        spawnConfetti(line);
        setTimeout(()=> setTimeout(clearWinOverlay, 1200), 900);
      }

      function clearWinOverlay(){
        winOverlay.classList.remove('show');
        winPath.style.transition = 'none';
        winPath.setAttribute('d','');
        confettiRoot.innerHTML = '';
      }

      function spawnConfetti(line){
        confettiRoot.innerHTML = '';
        const mid = line[1];
        const midRect = cells[mid].getBoundingClientRect();
        const parentRect = boardEl.getBoundingClientRect();
        const cx = ((midRect.left + midRect.right)/2) - parentRect.left;
        const cy = ((midRect.top + midRect.bottom)/2) - parentRect.top;
        const colors = ['#ffd36b','#7c5cff','#2fb6ff','#ff7ab6','#86f0ff'];
        for (let i=0;i<14;i++){
          const dot = document.createElement('div');
          dot.className = 'confetti-dot';
          dot.style.left = (cx - 5 + (Math.random()*40-20)) + 'px';
          dot.style.top = (cy - 5 + (Math.random()*40-20)) + 'px';
          dot.style.background = colors[i % colors.length];
          confettiRoot.appendChild(dot);
          setTimeout(()=> {
            dot.classList.add('show');
            dot.style.transform = `translate(${(Math.random()*160-80)}px, ${-(100 + Math.random()*80)}px) scale(${0.7 + Math.random()})`;
            dot.style.opacity = '1';
          }, 80 + i*40);
          setTimeout(()=> { dot.style.opacity = '0'; }, 1600 + i*40);
        }
      }

      function flashDraw(){
        cells.forEach((c,i) => {
          c.classList.add('win');
          setTimeout(()=> c.classList.remove('win'), 600 + i*20);
        });
      }

      function updateScores(){
        scoreXEl.textContent = scoreX;
        scoreOEl.textContent = scoreO;
        scoreDEl.textContent = scoreD;
      }

      function saveScores(){
        localStorage.setItem('ttt_scores', JSON.stringify({ x: scoreX, o: scoreO, d: scoreD }));
      }

      // controls
      function newGame(startFresh=false){
        board = Array(9).fill(null);
        finished = false;
        // If starting fresh (user pressed New Game), set who starts: X always
        current = 'X';
        clearWinOverlay();
        render();
        if (modeSelect.value === 'ai' && current === 'O') setTimeout(aiMove, 250);
      }

      // toggle AI options
      function toggleAIOptions(){
        if (modeSelect.value === 'ai') aiOptions.style.display = 'flex';
        else aiOptions.style.display = 'none';
        localStorage.setItem('ttt_mode', modeSelect.value);
      }

      // events
      cells.forEach(c => c.addEventListener('click', cellClick));
      newGameBtn.addEventListener('click', ()=> { newGame(true); });
      modeSelect.addEventListener('change', ()=> { toggleAIOptions(); localStorage.setItem('ttt_mode', modeSelect.value); });
      difficultySelect.addEventListener('change', ()=> { localStorage.setItem('ttt_diff', difficultySelect.value); });
      clearStorageBtn.addEventListener('click', ()=> {
        localStorage.removeItem('ttt_scores');
        localStorage.removeItem('ttt_mode');
        localStorage.removeItem('ttt_diff');
        scoreX = scoreO = scoreD = 0;
        updateScores();
        modeSelect.value = 'local';
        difficultySelect.value = 'easy';
        toggleAIOptions();
        infoEl.textContent = 'Сброшены настройки и счёт';
        setTimeout(()=> infoEl.textContent = '', 1600);
      });

      // keyboard accessibility
      document.addEventListener('keydown', (e)=>{
        if (e.key === 'r' || e.key === 'R') newGame(true);
      });

      // initialize
      render();
    })();
  </script>
</body>
</html>
